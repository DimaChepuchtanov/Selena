name: Selena checks

on:
  push:
    branches: [create-catalog, dev, prod-setting, vps-production]
  pull_request:
    branches: [create-catalog, dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selena
          POSTGRES_USER: selena
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selena -d selena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: manager.settings.dev
      SECRET_KEY: django-integration-test-key-not-for-production
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DATABASE: selena
      PG_USER: selena
      PG_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test --verbosity 2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    env:
      PG_USER: selena
      PG_PASSWORD: integration-test-only
      PG_DATABASE: selena
      SECRET_KEY: integration-test-django-key
      FRONTEND_PORT: "5173"
      APP_PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start database, migrations, backend and frontend
        run: docker compose up -d --build
      - name: Smoke test API, frontend routes, CSRF and session authentication
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://localhost:5173/ -o /tmp/selena-index.html
          grep -q '<div id="root"></div>' /tmp/selena-index.html
          for path in /auth /reg /catalog /profile /manage /static/img/arcana.svg /api/catalog/; do
            curl -fsS "http://localhost:5173${path}" -o /dev/null
          done
          csrf=$(curl -fsS -c /tmp/selena-cookies -b /tmp/selena-cookies http://localhost:5173/user/csrf/ | python3 -c 'import json,sys; print(json.load(sys.stdin)["csrfToken"])')
          curl -fsS -c /tmp/selena-cookies -b /tmp/selena-cookies \
            -H "Accept: application/json" -H "X-CSRFToken: ${csrf}" \
            --data-urlencode 'email=smoke@example.com' \
            --data-urlencode 'password=TestPassword-2026!' \
            --data-urlencode 'password_confirm=TestPassword-2026!' \
            --data-urlencode 'agreement=on' \
            http://localhost:5173/user/reg/ -o /tmp/selena-registration.json
          python3 -c 'import json; assert json.load(open("/tmp/selena-registration.json"))["ok"]'
          csrf=$(curl -fsS -c /tmp/selena-cookies -b /tmp/selena-cookies http://localhost:5173/user/csrf/ | python3 -c 'import json,sys; print(json.load(sys.stdin)["csrfToken"])')
          curl -fsS -b /tmp/selena-cookies http://localhost:5173/api/me/ -o /tmp/selena-me.json
          python3 -c 'import json; assert json.load(open("/tmp/selena-me.json"))["email"] == "smoke@example.com"'
          status=$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/selena-cookies http://localhost:5173/api/manage/me/)
          test "${status}" = "403"
          curl -fsS -b /tmp/selena-cookies -c /tmp/selena-cookies \
            -H "Accept: application/json" -H "X-CSRFToken: ${csrf}" \
            -X POST http://localhost:5173/user/logout/ -o /tmp/selena-logout.json
          python3 -c 'import json; assert json.load(open("/tmp/selena-logout.json"))["ok"]'
          csrf=$(curl -fsS -c /tmp/selena-cookies -b /tmp/selena-cookies http://localhost:5173/user/csrf/ | python3 -c 'import json,sys; print(json.load(sys.stdin)["csrfToken"])')
          curl -fsS -b /tmp/selena-cookies -c /tmp/selena-cookies \
            -H "Accept: application/json" -H "X-CSRFToken: ${csrf}" \
            --data-urlencode 'email=smoke@example.com' \
            --data-urlencode 'password=TestPassword-2026!' \
            http://localhost:5173/user/auth/ -o /tmp/selena-login.json
          python3 -c 'import json; assert json.load(open("/tmp/selena-login.json"))["ok"]'
      - name: Print container status and logs
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --tail=80 db-init
          docker compose logs --tail=80 web
          docker compose logs --tail=80 frontend
      - name: Stop stack
        if: always()
        run: docker compose down


  production-settings:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selena
          POSTGRES_USER: selena
          POSTGRES_PASSWORD: prod-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selena -d selena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: manager.settings.prod
      SITE_DOMAIN: example.test
      SECRET_KEY: safe-ci-placeholder-secret-not-for-any-public-use-2026
      PG_HOST: localhost
      PG_PORT: "5432"
      PG_DATABASE: selena
      PG_USER: selena
      PG_PASSWORD: prod-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.prod.txt
      - name: Check production HTTPS security settings
        env:
          USE_HTTPS: "1"
        run: |
          python manage.py check --deploy --fail-level ERROR
          python -c "from django.conf import settings; assert not settings.DEBUG; assert settings.SESSION_COOKIE_SECURE; assert settings.CSRF_COOKIE_SECURE; assert settings.SECURE_SSL_REDIRECT; assert settings.ALLOWED_HOSTS == ['example.test','www.example.test']; assert settings.STATIC_URL == '/django-static/'"
      - name: Check production migrations and execute all tests
        env:
          USE_HTTPS: "0"
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
          python manage.py test --verbosity 2
      - name: Verify frontend production build
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.prod.txt pip-audit bandit
      - run: python -m pip_audit
      - run: python -m pip check
      - run: bandit -r catalog identity manager profile_ -ll -q
      - name: Verify no environment secrets are tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo '::error::The real .env must not be committed'
            exit 1
          fi
      - run: cd frontend && npm ci && npm audit --omit=dev --audit-level=high

  vps-production-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable production CI environment
        run: |
          cat > .env.production <<'EOF'
          SITE_DOMAIN=example.test
          DJANGO_SETTINGS_MODULE=manager.settings.prod
          SECRET_KEY=ci-only-throwaway-secret-not-for-real-production-2026
          PG_USER=selena
          PG_PASSWORD=ci-postgres-test-password-only
          PG_DATABASE=selena
          PG_SSLMODE=prefer
          USE_HTTPS=0
          TRUST_PROXY_SSL_HEADER=0
          HSTS_SECONDS=0
          EOF
      - name: Validate production Compose and PostgreSQL healthcheck
        run: |
          docker compose --env-file .env.production -f compose.prod.yml config --quiet
          python3 - <<'PY'
          from pathlib import Path
          compose = Path('compose.prod.yml').read_text()
          assert 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}' in compose
          assert '$${POSTGRES_USER}' not in compose
          assert '$${POSTGRES_DB}' not in compose
          PY
      - name: Build and start production containers
        run: docker compose --env-file .env.production -f compose.prod.yml up -d --build
      - name: Smoke test production React, Django, CSRF, database, media and static
        shell: bash
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:8080
          curl --retry 25 --retry-delay 2 --retry-all-errors -fsS -H "Host: example.test" "$BASE/" -o /tmp/selena-prod-index.html
          grep -q '<div id="root"></div>' /tmp/selena-prod-index.html
          for path in /catalog /auth /reg /profile /manage /static/img/arcana.svg /django-static/admin/css/base.css /api/catalog/; do
            curl -fsS -H "Host: example.test" "$BASE$path" -o /dev/null
          done
          csrf=$(curl -fsS -H "Host: example.test" -c /tmp/prod-cookies -b /tmp/prod-cookies "$BASE/user/csrf/" | python3 -c 'import sys,json;print(json.load(sys.stdin)["csrfToken"])')
          curl -fsS -H "Host: example.test" -H "Accept: application/json" -H "X-CSRFToken: $csrf" \
            -c /tmp/prod-cookies -b /tmp/prod-cookies \
            --data-urlencode 'email=prod-smoke@example.com' \
            --data-urlencode 'password=ProdSmokePassword-2026!' \
            --data-urlencode 'password_confirm=ProdSmokePassword-2026!' \
            --data-urlencode 'agreement=on' \
            "$BASE/user/reg/" -o /tmp/registration.json
          python3 -c 'import json;assert json.load(open("/tmp/registration.json"))["ok"]'
          curl -fsS -H "Host: example.test" -b /tmp/prod-cookies "$BASE/api/me/" | python3 -c 'import sys,json;assert json.load(sys.stdin)["email"]=="prod-smoke@example.com"'
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Host: example.test" -b /tmp/prod-cookies "$BASE/api/manage/me/")
          test "$status" = "403"
          docker compose --env-file .env.production -f compose.prod.yml exec -T web python manage.py check --deploy --fail-level ERROR
      - name: Dump container status and logs for diagnostics
        if: always()
        run: |
          docker compose --env-file .env.production -f compose.prod.yml ps -a
          docker compose --env-file .env.production -f compose.prod.yml logs --tail=75 db-init web frontend
      - name: Clean up temporary CI test volumes
        if: always()
        run: docker compose --env-file .env.production -f compose.prod.yml down -v
