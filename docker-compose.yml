services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-selena}
      POSTGRES_USER: ${PG_USER:-selena}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
      POSTGRES_PORT: 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init/001_create_schemas.sql:/docker-entrypoint-initdb.d/001_create_schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build: .
    restart: "no"
    environment:
      DJANGO_SETTINGS_MODULE: manager.settings.dev
      PG_HOST: db
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-selena}
      PG_USER: ${PG_USER:-selena}
      PG_PASSWORD: ${PG_PASSWORD:-change-me}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command:
      - sh
      - -ec
      - |
        python manage.py shell -c "from pathlib import Path; from django.db import connection; sql = Path('db/init/001_create_schemas.sql').read_text(encoding='utf-8'); connection.cursor().execute(sql)"
        python manage.py migrate --noinput

  web:
    build: .
    restart: unless-stopped
    command: sh -c "python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: manager.settings.dev
      PG_HOST: db
      PG_PORT: 5432
      PG_DATABASE: ${PG_DATABASE:-selena}
      PG_USER: ${PG_USER:-selena}
      PG_PASSWORD: ${PG_PASSWORD:-change-me}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully
    volumes:
      - .:/app

volumes:
  postgres_data:
