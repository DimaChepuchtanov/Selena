<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Изменение товара</title>

    <style>
        body {
            max-width: 700px;
            margin: 40px auto;
            font-family: Arial, sans-serif;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        input,
        select,
        textarea {
            padding: 10px;
            font-size: 16px;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
        }

        .delete-button {
            color: white;
            background: #c62828;
            border: none;
        }

        .save-button {
            color: white;
            background: #1565c0;
            border: none;
        }

        #message {
            margin-top: 20px;
        }

    .comments-section {
        margin-top: 40px;
        padding-top: 24px;
        border-top: 1px solid #ddd;
    }

    #comments-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 24px;
    }

    .comment {
        padding: 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
    }

    .comment-header {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 10px;
    }

    .comment-header time {
        color: #666;
        font-size: 14px;
    }

    .comment p {
        margin: 0;
        white-space: pre-wrap;
    }

    .comment-rating {
        margin-bottom: 10px;
        font-weight: 600;
    }

    #comment-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    #comment-text {
        padding: 12px;
        resize: vertical;
    }

    #comment-form button {
        align-self: flex-start;
        padding: 10px 18px;
        cursor: pointer;
    }
    </style>
</head>

<body>
    <h1>Изменение товара</h1>

    <form id="product-form">
        {% csrf_token %}

        <label>
            Название

            <input
                type="text"
                name="title"
                value="{{ product.title }}"
                required
            >
        </label>

        <label>
            Описание

            <textarea
                name="description"
                required
            >{{ product.description }}</textarea>
        </label>

        <label>
            Рейтинг

            <input
                type="number"
                name="rating"
                value="{{ product.rating }}"
                min="0"
                max="5"
                step="0.1"
            >
        </label>

        <label>
            Цена

            <input
                type="number"
                name="price"
                value="{{ product.price }}"
                min="0"
                step="0.01"
                required
            >
        </label>

        <label>
            Остаток товара

            <input
                type="number"
                name="stock_quantity"
                value="{{ product.stock_quantity }}"
                min="0"
                required
            >
        </label>

        <div class="actions">
            <button
                type="submit"
                class="save-button"
            >
                Сохранить изменения
            </button>

            <button
                type="button"
                id="delete-button"
                class="delete-button"
            >
                Удалить товар
            </button>
        </div>
    </form>

    <div id="message">
        <section class="comments-section">
    <h2>Комментарии</h2>

    <div id="comments-list">
        <p>Загрузка комментариев...</p>
    </div>

    <!-- {% if request.user.is_authenticated %} -->
        <form id="comment-form">
            {% csrf_token %}

            <label for="comment-rating">
                Оценка
            </label>

            <select
                id="comment-rating"
                name="rating"
                required
            >
                <option value="" selected disabled>
                    Выберите оценку
                </option>
                <option value="5">5 — Отлично</option>
                <option value="4">4 — Хорошо</option>
                <option value="3">3 — Нормально</option>
                <option value="2">2 — Плохо</option>
                <option value="1">1 — Очень плохо</option>
            </select>

            <label for="comment-text">
                Ваш комментарий
            </label>

            <textarea
                id="comment-text"
                name="text"
                maxlength="2000"
                rows="5"
                required
            ></textarea>

            <button type="submit">
                Отправить комментарий
            </button>
        </form>

        <p id="comment-message"></p>
    <!-- {% else %}
        <p>
            Для отправки комментария необходимо
            авторизоваться.
        </p>
    {% endif %} -->
</section>
    </div>

    <script>
        const productForm =
            document.getElementById("product-form");

        const deleteButton =
            document.getElementById("delete-button");

        const message =
            document.getElementById("message");

        const apiUrl =
            "{% url 'product-detail' product.uuid %}";

        function getCsrfToken() {
            const csrfInput = document.querySelector(
                "[name=csrfmiddlewaretoken]"
            );

            return csrfInput.value;
        }

        productForm.addEventListener(
            "submit",
            async (event) => {
                event.preventDefault();

                const formData = new FormData(productForm);

                const response = await fetch(
                    apiUrl,
                    {
                        method: "PATCH",
                        headers: {
                            "X-CSRFToken": getCsrfToken(),
                        },
                        body: formData,
                    },
                );

                const data = await response.json();

                if (!response.ok) {
                    message.textContent =
                        JSON.stringify(data);

                    return;
                }

                message.textContent =
                    "Товар успешно изменён";
            },
        );

        deleteButton.addEventListener(
            "click",
            async () => {
                const confirmed = confirm(
                    "Вы действительно хотите удалить товар?"
                );

                if (!confirmed) {
                    return;
                }

                const response = await fetch(
                    apiUrl,
                    {
                        method: "DELETE",
                        headers: {
                            "X-CSRFToken": getCsrfToken(),
                        },
                    },
                );

                if (!response.ok) {
                    const data = await response.json();

                    message.textContent =
                        JSON.stringify(data);

                    return;
                }

                window.location.href = "/products/";
            },
        );
        
    </script>
    <script>
    const commentsApiUrl =
        "{% url 'product-comments' product.uuid %}";

    const commentsList =
        document.getElementById("comments-list");

    const commentForm =
        document.getElementById("comment-form");

    const commentMessage =
        document.getElementById("comment-message");

    function getCsrfToken() {
        const input = document.querySelector(
            "[name=csrfmiddlewaretoken]"
        );

        return input ? input.value : "";
    }

    function createCommentElement(comment) {
        const article = document.createElement("article");
        article.className = "comment";

        const header = document.createElement("div");
        header.className = "comment-header";

        const author = document.createElement("strong");
        author.textContent = comment.author;

        const date = document.createElement("time");
        date.textContent = new Date(
            comment.created_at
        ).toLocaleString("ru-RU");

        const rating = document.createElement("div");
        rating.className = "comment-rating";
        rating.textContent = `Оценка: ${comment.rating} из 5`;

        const text = document.createElement("p");
        text.textContent = comment.text;

        header.append(author, date);
        article.append(header, rating, text);

        return article;
    }

    function renderComments(comments) {
        commentsList.replaceChildren();

        if (comments.length === 0) {
            const emptyMessage =
                document.createElement("p");

            emptyMessage.textContent =
                "Комментариев пока нет.";

            commentsList.append(emptyMessage);
            return;
        }

        for (const comment of comments) {
            commentsList.append(
                createCommentElement(comment)
            );
        }
    }

    async function loadComments() {
        try {
            const response = await fetch(
                commentsApiUrl,
                {
                    method: "GET",
                    headers: {
                        "Accept": "application/json",
                    },
                },
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    "Не удалось загрузить комментарии."
                );
            }

            renderComments(data);
        } catch (error) {
            commentsList.textContent =
                "Ошибка загрузки комментариев.";
        }
    }

    if (commentForm) {
        commentForm.addEventListener(
            "submit",
            async (event) => {
                event.preventDefault();

                const textarea =
                    document.getElementById(
                        "comment-text"
                    );

                const ratingInput =
                    document.getElementById(
                        "comment-rating"
                    );

                const text = textarea.value.trim();
                const rating = Number(ratingInput.value);

                if (!Number.isInteger(rating) || rating < 1 || rating > 5) {
                    commentMessage.textContent =
                        "Выберите оценку от 1 до 5.";

                    return;
                }

                if (!text) {
                    commentMessage.textContent =
                        "Введите текст комментария.";

                    return;
                }

                try {
                    const response = await fetch(
                        commentsApiUrl,
                        {
                            method: "POST",
                            headers: {
                                "Accept":
                                    "application/json",
                                "Content-Type":
                                    "application/json",
                                "X-CSRFToken":
                                    getCsrfToken(),
                            },
                            body: JSON.stringify({
                                text: text,
                                rating: rating,
                            }),
                        },
                    );

                    const data =
                        await response.json();

                    if (!response.ok) {
                        commentMessage.textContent =
                            JSON.stringify(data);

                        return;
                    }

                    textarea.value = "";
                    ratingInput.value = "";

                    commentMessage.textContent =
                        "Комментарий добавлен.";

                    await loadComments();
                } catch (error) {
                    commentMessage.textContent =
                        "Ошибка отправки комментария.";
                }
            },
        );
    }

    loadComments();
</script>
</body>
</html>
